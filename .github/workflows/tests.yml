name: tests

on:
  push:
  pull_request:

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-agent.txt
      # Scripted model + mocked API: no API key or network needed
      - run: pytest -q
